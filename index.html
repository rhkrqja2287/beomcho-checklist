<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>범초생필품</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151716" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생필품">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f2328;--sub:#6b7280;--line:#e5e2da;--accent:#2f7d5b;--accent-soft:#e3f1ea;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151716;--card:#1f2221;--text:#e8eae9;--sub:#9aa3a0;--line:#2f3432;--accent:#5cbf93;--accent-soft:#1d3329;--danger:#e57366;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151716;--card:#1f2221;--text:#e8eae9;--sub:#9aa3a0;--line:#2f3432;--accent:#5cbf93;--accent-soft:#1d3329;--danger:#e57366;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
body.dragging{user-select:none;-webkit-user-select:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--sub);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;min-height:40px}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;align-self:start}
.card h2{font-size:1.05rem;margin:0 0 8px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.card h2 b{flex:1}
.card h2 span{font-size:.8rem;color:var(--sub);font-weight:400}
ul{list-style:none;margin:0;padding:0}
ul.edit{min-height:40px}
li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
li label{flex:1;cursor:pointer;word-break:keep-all}
li.done label{color:var(--sub);text-decoration:line-through}
li.dragging{background:var(--accent-soft);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.x{border:0;background:none;color:var(--sub);padding:4px 8px;min-height:32px}
.x:hover{color:var(--danger)}
.grip{cursor:grab;touch-action:none;color:var(--sub);padding:6px 6px;font-size:1.1rem;line-height:1;flex:none;user-select:none;-webkit-user-select:none}
.ed,.add input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.add{display:flex;gap:6px;margin-top:10px}
.empty{color:var(--sub);font-size:.9rem;padding:8px 2px}
.newcat{margin:0 0 4px}
.pr{width:96px;flex:none;text-align:right;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.budget{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 10px}
.budget b{font-size:1.2rem;color:var(--accent)}
.budget[hidden]{display:none}
.edonly{display:none}
.editing .edonly{display:flex}
.editing .viewonly{display:none}
@media (max-width:639px){
body{font-size:14px;line-height:1.35}
.wrap{padding:12px 10px 32px}
header{gap:8px;margin-bottom:6px}
h1{font-size:1.2rem}
.sub{font-size:.78rem}
.bar{height:6px;margin:6px 0 8px}
button{font-size:.82rem;padding:5px 9px;min-height:32px;border-radius:8px}
.tools{gap:6px}
.grid{gap:8px;margin-top:8px}
.card{padding:8px 12px;border-radius:12px}
.card h2{font-size:.95rem;margin-bottom:2px}
.card h2 span{font-size:.75rem}
li{padding:5px 2px;gap:8px}
li input[type=checkbox]{width:18px;height:18px}
.x{min-height:28px;padding:2px 6px}
.grip{padding:4px 4px}
.ed,.add input{font-size:16px;padding:6px 8px;border-radius:8px}
.add{margin-top:6px}
.empty{font-size:.8rem;padding:4px 2px}
.pr{width:84px;font-size:16px;padding:5px 7px}
.budget{padding:8px 12px;margin-bottom:8px}
.budget b{font-size:1.1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🛒 생필품 체크리스트</h1>
      <div class="sub"><span id="count"></span> · <span id="sync"></span></div>
    </div>
    <div class="tools">
      <button id="edit">✏️ 수정</button>
      <button id="filter" class="viewonly">필요 항목</button>
      <button id="checkall" class="viewonly">모두 체크</button>
      <button id="reset" class="viewonly">모두 해제</button>
      <button id="theme">🌓</button>
    </div>
  </header>
  <div class="bar"><i id="fill"></i></div>
  <div class="budget viewonly" id="budget" hidden><span>💰 필요 예산 <b id="bsum">0원</b></span><span class="sub" id="bnote"></span></div>
  <div class="add newcat edonly"><input id="catname" placeholder="새 카테고리 이름 (예: 🧂 조미료)" aria-label="새 카테고리 이름"><button id="catadd">카테고리 추가</button></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const DEFAULT=[
["🍳 주방",["키친타월","지퍼백","랩·호일","주방세제","수세미","음식물 쓰레기봉투","종량제 봉투"]],
["🚿 욕실",["샴푸·린스","바디워시","치약","칫솔","화장지","핸드워시","면도기"]],
["🧺 세탁·청소",["세탁세제","섬유유연제","물티슈","청소 스프레이","고무장갑","곰팡이 제거제"]],
["🍚 식료품",["쌀","계란","우유","식용유","소금·설탕","라면"]],
["🔧 기타",["건전지","마스크","상비약","전구"]]
];
const firebaseConfig={
  apiKey:"AIzaSyBM4Rd5Sqr1eATSbny_fibk3A1XEVL2wEI",
  authDomain:"beomcho-checklist.firebaseapp.com",
  databaseURL:"https://beomcho-checklist-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"beomcho-checklist",
  storageBucket:"beomcho-checklist.firebasestorage.app",
  messagingSenderId:"327194969353",
  appId:"1:327194969353:web:ae2123962d2b160255bfd8"
};
const KEY="supplies-checklist-v2",OLD="supplies-checklist-v1";
let state,onlyLeft=false,editing=false,focusCat=null,dragging=false,pending=null,root=null,online=false;
const $=id=>document.getElementById(id);
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function seedState(){
  try{const s=localStorage.getItem(OLD);if(s)return JSON.parse(s).map((c,ci)=>({id:"c"+ci,n:c.n,items:c.items.map((it,ii)=>({id:`c${ci}i${ii}`,t:it.t,d:!!it.d,p:Number(it.p)||0}))}))}catch(e){}
  return DEFAULT.map(([n,a],ci)=>({id:"c"+ci,n,items:a.map((t,ii)=>({id:`c${ci}i${ii}`,t,d:false,p:0}))}));
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
state=load()||seedState();

/* ---- Firebase 동기화 ---- */
const W=(p,v)=>{try{if(root)root.child(p).set(v)}catch(e){console.error(e)}};
const R=p=>W(p,null);
function parse(v){
  const by=(a,b)=>(a.o-b.o)||(a.id<b.id?-1:1);
  return Object.entries((v&&v.cats)||{}).filter(([,c])=>c&&c.n).map(([id,c])=>({id,n:c.n,o:c.o||0,
    items:Object.entries(c.items||{}).filter(([,i])=>i&&i.t).map(([iid,i])=>({id:iid,t:i.t,d:!!i.d,p:Number(i.p)||0,o:i.o||0})).sort(by)}))
    .sort(by).map(c=>({id:c.id,n:c.n,items:c.items.map(({id,t,d,p})=>({id,t,d,p}))}));
}
function buildSeed(st){
  const cats={};
  st.forEach((c,ci)=>{const items={};c.items.forEach((it,ii)=>{items[it.id]={t:it.t,d:it.d,o:ii,...(it.p?{p:it.p}:{})}});cats[c.id]={n:c.n,o:ci,items}});
  return {meta:{seeded:true},cats};
}
function busy(){
  if(dragging)return true;
  const a=document.activeElement;
  return !!a&&a.tagName==="INPUT"&&(a.classList.contains("ed")||a.classList.contains("pr")||Boolean(a.closest(".add")&&a.value));
}
function flush(){if(!pending||busy())return;state=pending;pending=null;save();render()}
function onRemote(snap){
  const v=snap.val();
  if(!v){root.set(buildSeed(state));return}
  const next=parse(v);
  if(JSON.stringify(next)===JSON.stringify(state)){pending=null;return}
  pending=next;flush();
}
document.addEventListener("focusout",()=>setTimeout(flush,60));
try{
  if(window.firebase){
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();root=db.ref("checklist");
    db.ref(".info/connected").on("value",s=>{online=!!s.val();updateStatus()});
    root.on("value",onRemote,err=>{console.error(err);root=null;updateStatus()});
  }
}catch(e){console.error(e);root=null}
function updateStatus(){$("sync").textContent=!root?"⚠ 동기화 꺼짐":online?"☁ 동기화됨":"⚠ 오프라인 · 연결되면 자동 동기화"}

/* ---- 드래그 ---- */
function startDrag(e){
  e.preventDefault();
  const li=e.currentTarget.parentNode;
  const origin={};state.forEach(c=>c.items.forEach(it=>origin[it.id]=c.id));
  dragging=true;li.classList.add("dragging");document.body.classList.add("dragging");
  const move=ev=>{
    const y=ev.clientY;
    if(y<60)scrollBy(0,-12);else if(y>innerHeight-60)scrollBy(0,12);
    const el=document.elementFromPoint(ev.clientX,y);
    if(!el)return;
    const other=el.closest("li");
    if(other&&other!==li&&other.parentNode.classList.contains("edit")){
      const r=other.getBoundingClientRect();
      other.parentNode.insertBefore(li,y<r.top+r.height/2?other:other.nextSibling);
      return;
    }
    const card=el.closest(".card");
    if(!card)return;
    const ul=card.querySelector("ul.edit");if(!ul)return;
    const r=ul.getBoundingClientRect();
    if(!ul.querySelector("li"))ul.append(li);
    else if(y<r.top)ul.prepend(li);
    else if(y>r.bottom)ul.append(li);
  };
  const end=()=>{
    removeEventListener("pointermove",move);removeEventListener("pointerup",end);removeEventListener("pointercancel",end);
    li.classList.remove("dragging");document.body.classList.remove("dragging");
    const upd={};
    document.querySelectorAll(".card").forEach(card=>{
      const ul=card.querySelector("ul.edit");if(!ul)return;
      const c=state[+card.dataset.ci];
      c.items=[...ul.children].map(l=>l._item);
      c.items.forEach((it,i)=>{
        upd[`cats/${c.id}/items/${it.id}`]={t:it.t,d:it.d,o:i,...(it.p?{p:it.p}:{})};
        if(origin[it.id]!==c.id)upd[`cats/${origin[it.id]}/items/${it.id}`]=null;
      });
    });
    dragging=false;pending=null;save();render();
    try{if(root)root.update(upd)}catch(err){console.error(err)}
  };
  addEventListener("pointermove",move);addEventListener("pointerup",end);addEventListener("pointercancel",end);
}

function updateBudget(){
  const el=$("budget");
  if(!onlyLeft||editing){el.hidden=true;return}
  let sum=0,left=0,miss=0;
  state.forEach(c=>c.items.forEach(i=>{if(!i.d){left++;if(i.p)sum+=i.p;else miss++}}));
  el.hidden=false;
  $("bsum").textContent=sum.toLocaleString("ko-KR")+"원";
  $("bnote").textContent=left?(miss?`남은 ${left}개 중 금액 미입력 ${miss}개`:`남은 ${left}개 모두 입력됨`):"남은 품목이 없어요";
}
/* ---- 화면 ---- */
function render(){
  document.body.classList.toggle("editing",editing);
  const g=$("grid");g.innerHTML="";
  let total=0,done=0;
  state.forEach((c,ci)=>{
    total+=c.items.length;done+=c.items.filter(i=>i.d).length;
    const card=document.createElement("div");card.className="card";card.dataset.ci=ci;
    const h=document.createElement("h2");
    if(editing){
      const ni=document.createElement("input");ni.className="ed";ni.value=c.n;ni.setAttribute("aria-label","카테고리 이름");
      ni.onchange=()=>{const v=ni.value.trim();if(v){c.n=v;save();W(`cats/${c.id}/n`,v)}else ni.value=c.n};
      ni.onkeydown=e=>{if(e.key==="Enter")ni.blur()};
      const dx=document.createElement("button");dx.className="x";dx.textContent="🗑";dx.title="카테고리 삭제";dx.setAttribute("aria-label","카테고리 삭제");
      dx.onclick=()=>{
        if(!dx.dataset.arm){dx.dataset.arm="1";dx.textContent="삭제?";dx.style.color="var(--danger)";setTimeout(()=>{delete dx.dataset.arm;dx.textContent="🗑";dx.style.color=""},3000)}
        else{state.splice(ci,1);save();render();R(`cats/${c.id}`)}
      };
      h.append(ni,dx);
    }else{
      const nm=document.createElement("b");nm.textContent=c.n;
      const sp=document.createElement("span");sp.textContent=`${c.items.filter(i=>i.d).length}/${c.items.length}`;
      h.append(nm,sp);
    }
    card.append(h);
    const ul=document.createElement("ul");if(editing)ul.className="edit";
    let shown=0;
    c.items.forEach((it,ii)=>{
      if(!editing&&onlyLeft&&it.d)return;shown++;
      const li=document.createElement("li");li._item=it;
      if(editing){
        const gr=document.createElement("span");gr.className="grip";gr.textContent="⠿";gr.title="끌어서 순서 변경";
        gr.addEventListener("pointerdown",startDrag);
        const inp=document.createElement("input");inp.className="ed";inp.value=it.t;inp.setAttribute("aria-label","항목 이름");
        inp.onchange=()=>{const v=inp.value.trim();if(v){it.t=v;save();W(`cats/${c.id}/items/${it.id}/t`,v)}else inp.value=it.t};
        inp.onkeydown=e=>{if(e.key==="Enter")inp.blur()};
        const x=document.createElement("button");x.className="x";x.textContent="✕";x.title="삭제";x.setAttribute("aria-label","삭제");
        x.onclick=()=>{c.items.splice(c.items.indexOf(it),1);save();render();R(`cats/${c.id}/items/${it.id}`)};
        li.append(gr,inp,x);
      }else{
        if(it.d)li.className="done";
        const id=`i${ci}_${ii}`;
        const cb=document.createElement("input");cb.type="checkbox";cb.id=id;cb.checked=it.d;
        cb.onchange=()=>{it.d=cb.checked;save();render();W(`cats/${c.id}/items/${it.id}/d`,it.d)};
        const lb=document.createElement("label");lb.htmlFor=id;lb.textContent=it.t;
        li.append(cb,lb);
        if(onlyLeft){
          const pi=document.createElement("input");pi.className="pr";pi.type="text";pi.inputMode="numeric";pi.placeholder="금액";pi.setAttribute("aria-label",it.t+" 금액");
          if(it.p)pi.value=it.p.toLocaleString("ko-KR");
          pi.onfocus=()=>{pi.value=it.p?String(it.p):"";pi.select()};
          pi.oninput=()=>{it.p=Number(pi.value.replace(/\D/g,""))||0;updateBudget()};
          pi.onblur=()=>{save();W(`cats/${c.id}/items/${it.id}/p`,it.p||null);pi.value=it.p?it.p.toLocaleString("ko-KR"):""};
          pi.onkeydown=e=>{if(e.key==="Enter")pi.blur()};
          li.append(pi);
        }
      }
      ul.append(li);
    });
    card.append(ul);
    if(!editing&&!shown){const p=document.createElement("div");p.className="empty";p.textContent=onlyLeft?"다 챙겼어요 👍":"품목이 없습니다";card.append(p)}
    if(editing){
      const f=document.createElement("div");f.className="add";
      f.innerHTML=`<input placeholder="품목 추가" aria-label="품목 추가"><button>추가</button>`;
      const inp=f.querySelector("input");
      const add=()=>{
        const v=inp.value.trim();if(!v)return;inp.value="";
        const it={id:nid(),t:v,d:false,p:0};c.items.push(it);save();focusCat=ci;render();
        W(`cats/${c.id}/items/${it.id}`,{t:v,d:false,o:Date.now()});
      };
      f.querySelector("button").onclick=add;
      inp.onkeydown=e=>{if(e.key==="Enter")add()};
      card.append(f);
    }
    g.append(card);
  });
  $("count").textContent=`${done} / ${total} 챙김 · 남은 품목 ${total-done}개`;
  updateStatus();updateBudget();
  $("fill").style.width=(total?done/total*100:0)+"%";
  $("filter").classList.toggle("on",onlyLeft);
  $("edit").classList.toggle("on",editing);
  $("edit").textContent=editing?"✓ 수정 완료":"✏️ 수정";
  if(focusCat!==null){
    const inp=g.querySelector(`.card[data-ci="${focusCat}"] .add input`);
    if(inp)inp.focus();
    focusCat=null;
  }
}
$("edit").onclick=()=>{editing=!editing;render()};
$("filter").onclick=()=>{onlyLeft=!onlyLeft;render()};
$("checkall").onclick=()=>{
  const u={};
  state.forEach(c=>c.items.forEach(i=>{if(!i.d){i.d=true;u[`cats/${c.id}/items/${i.id}/d`]=true}}));
  save();render();
  try{if(root&&Object.keys(u).length)root.update(u)}catch(e){console.error(e)}
};
$("reset").onclick=()=>{
  const u={};
  state.forEach(c=>c.items.forEach(i=>{if(i.d){i.d=false;u[`cats/${c.id}/items/${i.id}/d`]=false}}));
  save();render();
  try{if(root&&Object.keys(u).length)root.update(u)}catch(e){console.error(e)}
};
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
const addCat=()=>{
  const v=$("catname").value.trim();if(!v)return;
  const c={id:nid(),n:v,items:[]};state.push(c);$("catname").value="";save();focusCat=state.length-1;render();
  W(`cats/${c.id}`,{n:v,o:Date.now()});
};
$("catadd").onclick=addCat;
$("catname").onkeydown=e=>{if(e.key==="Enter")addCat()};
render();
</script>
</body>
</html>
